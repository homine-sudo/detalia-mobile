<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HT経営分析">
<meta name="theme-color" content="#0A0A0F">
<meta name="robots" content="noindex,nofollow">
<title>Hari Terrace 経営分析</title>
<link rel="icon" type="image/png" href="ht_logo.png">
<link rel="apple-touch-icon" href="ht_logo.png">
<style>
:root{
  --bg:#0A0A0F; --bg2:#10101A; --card:#1A1A2A; --card2:#22223A;
  --gold:#C9A84C; --gold-light:#E8C96A; --gold-deep:#A38A36;
  --gold-dim:rgba(201,168,76,.15); --gold-border:rgba(201,168,76,.28);
  --lime:#B8E986;
  --text:#F4E9C6; --text-dim:#A89D7B; --muted:#6B6B5A;
  --border:rgba(201,168,76,.18);
  /* chart series — validated (dark surface #1A1A2A) */
  --s1:#AD8F3A; --s2:#3987e5; --s3:#199e70; --s4:#9085e9; --s5:#e66767;
  /* status — fixed scale */
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --grid:rgba(255,255,255,.07); --axis:rgba(255,255,255,.16);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  font-size:15px;color:var(--text);background:linear-gradient(180deg,#0A0A0F,#10101A);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0;user-select:none}
.num{font-variant-numeric:tabular-nums}
svg text{font-family:inherit}

/* ── shell ── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;background:rgba(10,10,15,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)}
#hdr .t{font-size:15px;font-weight:700;letter-spacing:.06em}
#hdr .d{font-size:10px;color:var(--text-dim);margin-top:2px}
#hdr .sp{flex:1}
#hdr .lockbtn{font-size:11px;color:var(--text-dim);border:1px solid var(--border);border-radius:14px;padding:5px 11px}
#main{padding:calc(var(--safe-top) + 64px) 14px calc(var(--safe-bottom) + 86px);max-width:640px;margin:0 auto}
.page{display:none}.page.active{display:block;animation:fin .22s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:rgba(10,10,15,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);
  padding:6px 4px calc(var(--safe-bottom) + 6px)}
#tabs button{flex:1;text-align:center;color:var(--muted);padding:5px 0}
#tabs button .ic{font-size:19px;line-height:1}
#tabs button .lb{font-size:9.5px;margin-top:3px;letter-spacing:.04em}
#tabs button.on{color:var(--gold)}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 15px;margin-bottom:14px}
.card h2{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700;margin-bottom:12px}
.card h2 .sub{font-weight:400;color:var(--text-dim);letter-spacing:0;font-size:10px;margin-left:8px}
.note{font-size:11px;color:var(--text-dim);line-height:1.65;margin-top:10px}
.hairline{border:none;border-top:1px solid var(--grid);margin:12px 0}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--bg2);border:1px solid var(--grid);border-radius:11px;padding:11px 12px}
.tile .l{font-size:10px;color:var(--text-dim);letter-spacing:.05em}
.tile .v{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:.01em}
.tile .s{font-size:10px;margin-top:3px;color:var(--text-dim)}
.up{color:#4fc06c}.down{color:var(--st-serious)}
.gold{color:var(--gold-light)}

/* hero score */
.hero{display:flex;align-items:center;gap:18px}
.hero .ring{flex:0 0 auto}
.hero .hh{font-size:11px;color:var(--text-dim);letter-spacing:.1em}
.hero .hv{font-size:17px;font-weight:700;margin-top:3px}
.chip{display:inline-block;font-size:10.5px;padding:3px 10px;border-radius:12px;border:1px solid var(--gold-border);color:var(--gold-light);background:var(--gold-dim);margin-top:8px}

/* risk / status */
.risk{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--grid);align-items:flex-start}
.risk:last-child{border-bottom:none}
.risk .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px}
.risk .rn{font-size:13px;font-weight:600}
.risk .rv{font-size:12px;margin-left:6px}
.risk .rd{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:3px}
.stt{font-size:9.5px;letter-spacing:.08em;padding:2px 7px;border-radius:9px;margin-left:7px;vertical-align:1px}

ul.plain{list-style:none}
ul.plain li{font-size:12.5px;line-height:1.7;padding:6px 0 6px 16px;position:relative;color:var(--text)}
ul.plain li::before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--gold-deep)}
ul.plain.dim li{color:var(--text-dim)}

table.kv{width:100%;border-collapse:collapse}
table.kv td{font-size:12px;padding:7px 0;border-bottom:1px solid var(--grid);vertical-align:top;line-height:1.5}
table.kv tr:last-child td{border-bottom:none}
table.kv td:first-child{color:var(--text-dim);width:34%;padding-right:10px}

/* data tables */
table.dt{width:100%;border-collapse:collapse;font-size:11.5px}
table.dt th{font-size:10px;color:var(--text-dim);font-weight:400;text-align:right;padding:4px 4px;border-bottom:1px solid var(--axis)}
table.dt th:first-child,table.dt td:first-child{text-align:left;padding-left:0}
table.dt td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--grid)}
table.dt tr:last-child td{border-bottom:none}

/* charts */
.chart{margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 10px}
.legend span{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bench{padding:10px 0;border-bottom:1px solid var(--grid)}
.bench:last-child{border-bottom:none}
.bench .bh{display:flex;align-items:baseline;gap:8px}
.bench .bn{font-size:12px;font-weight:600;flex:1}
.bench .bv{font-size:14px;font-weight:700}
.bench .tag{font-size:9.5px;padding:2px 7px;border-radius:9px}
.bench .bnote{font-size:10px;color:var(--text-dim);margin-top:3px}

/* sliders */
.sl{margin:13px 0}
.sl .slh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.sl .slh b{color:var(--gold-light);font-weight:700}
input[type=range]{-webkit-appearance:none;width:100%;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--card2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--gold);border:3px solid var(--bg);margin-top:-9px;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.tgl{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:12px 0}
.tgl input{width:18px;height:18px;accent-color:var(--gold)}
.out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.out .o{background:var(--bg2);border:1px solid var(--grid);border-radius:10px;padding:9px 11px}
.out .o .l{font-size:9.5px;color:var(--text-dim)}
.out .o .v{font-size:16px;font-weight:700;margin-top:3px}
.judge{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.6;border:1px solid}

/* actions */
.act{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--grid);align-items:flex-start}
.act:last-child{border-bottom:none}
.act input{width:19px;height:19px;margin-top:1px;accent-color:var(--gold);flex:0 0 auto}
.act .at{font-size:12.5px;line-height:1.6}
.act.done .at{color:var(--muted);text-decoration:line-through}
.act .tag2{font-size:9px;color:var(--gold-deep);border:1px solid var(--gold-border);border-radius:8px;padding:1px 6px;margin-right:6px;vertical-align:1px}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#0A0A0F,#10101A);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#lock img{width:64px;height:64px;object-fit:contain;margin-bottom:18px;opacity:.9}
#lock .lt{font-size:16px;font-weight:700;letter-spacing:.12em}
#lock .ls{font-size:11px;color:var(--text-dim);margin:8px 0 26px;text-align:center;line-height:1.7}
#lock input[type=password]{width:100%;max-width:320px;background:var(--card);border:1px solid var(--gold-border);
  border-radius:12px;padding:13px 15px;font-size:16px;text-align:center;letter-spacing:.08em;outline:none}
#lock .lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin:16px 0 22px}
#lock .lbl input{width:17px;height:17px;accent-color:var(--gold)}
#lock button.go{width:100%;max-width:320px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  color:#0A0A0F;font-weight:700;font-size:15px;letter-spacing:.14em;border-radius:12px;padding:14px}
#lock .err{color:var(--st-serious);font-size:12px;margin-top:14px;min-height:16px}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 96px);transform:translateX(-50%) translateY(16px);
  background:var(--card2);border:1px solid var(--gold-border);color:var(--text);font-size:12px;
  padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.secnote{font-size:10px;color:var(--muted);text-align:center;margin:6px 0 20px;line-height:1.7}
</style>
</head>
<body>

<div id="lock">
  <img src="ht_logo.png" alt="">
  <div class="lt">経営分析 — Hari Terrace</div>
  <div class="ls">財務データは暗号化されています。<br>パスフレーズを入力してください。</div>
  <input type="password" id="pw" placeholder="パスフレーズ" autocomplete="current-password" enterkeyhint="go">
  <label class="lbl"><input type="checkbox" id="pw-keep">この端末で記憶する</label>
  <button class="go" onclick="unlock()">開 く</button>
  <div class="err" id="pw-err"></div>
</div>

<header id="hdr" style="display:none">
  <div>
    <div class="t">経営分析 <span style="color:var(--gold)">HT</span></div>
    <div class="d" id="hdr-date"></div>
  </div>
  <div class="sp"></div>
  <button class="lockbtn" onclick="relock()">🔒 ロック</button>
</header>

<main id="main" style="display:none">
  <div class="page" id="pg-home"></div>
  <div class="page" id="pg-fin"></div>
  <div class="page" id="pg-bench"></div>
  <div class="page" id="pg-asset"></div>
  <div class="page" id="pg-plan"></div>
</main>

<nav id="tabs" style="display:none">
  <button data-p="home" class="on"><div class="ic">📊</div><div class="lb">概況</div></button>
  <button data-p="fin"><div class="ic">📈</div><div class="lb">財務</div></button>
  <button data-p="bench"><div class="ic">⚖️</div><div class="lb">比較</div></button>
  <button data-p="asset"><div class="ic">🚗</div><div class="lb">資産</div></button>
  <button data-p="plan"><div class="ic">🎯</div><div class="lb">戦略</div></button>
</nav>

<div id="toast"></div>

const PBKDF2_ITER = 310000;
let DATA = null;

/* ── crypto ── */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...u));
async function deriveKey(pass, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:PBKDF2_ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWith(key){
  const raw = b64d(BLOB);
  const iv = raw.slice(16,28), body = raw.slice(28);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, body);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(){
  const pw = document.getElementById("pw");
  const err = document.getElementById("pw-err");
  err.textContent = "";
  if(!pw.value){ err.textContent = "パスフレーズを入力してください"; return; }
  try{
    const raw = b64d(BLOB);
    const key = await deriveKey(pw.value, raw.slice(0,16));
    DATA = await decryptWith(key);
    if(document.getElementById("pw-keep").checked){
      const kb = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      localStorage.setItem("kh_key", b64e(kb));
    }
    pw.value = "";
    boot();
  }catch(e){
    err.textContent = "パスフレーズが違います";
    pw.classList.add("shake"); setTimeout(()=>pw.classList.remove("shake"), 450);
  }
}
async function tryStoredKey(){
  const s = localStorage.getItem("kh_key");
  if(!s) return false;
  try{
    const key = await crypto.subtle.importKey("raw", b64d(s), {name:"AES-GCM"}, false, ["decrypt"]);
    DATA = await decryptWith(key);
    boot(); return true;
  }catch(e){ localStorage.removeItem("kh_key"); return false; }
}
function relock(){
  localStorage.removeItem("kh_key");
  location.reload();
}
document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });

/* ── format ── */
const C = { s1:"#AD8F3A", s2:"#3987e5", s3:"#199e70", s4:"#9085e9", s5:"#e66767",
  good:"#0ca30c", warn:"#fab219", serious:"#ec835a", crit:"#d03b3b",
  ink:"#F4E9C6", dim:"#A89D7B", grid:"rgba(255,255,255,.07)", axis:"rgba(255,255,255,.16)", gold:"#C9A84C" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function yen(v){
  const neg = v < 0 ? "△" : "";
  const a = Math.abs(v);
  if(a >= 1e8) return neg + (a/1e8).toFixed(2).replace(/\.?0+$/,"") + "億";
  if(a >= 1e4) return neg + Math.round(a/1e4).toLocaleString() + "万";
  return neg + a.toLocaleString() + "円";
}
const yenFull = v => (v<0?"△":"") + Math.abs(v).toLocaleString() + "円";
const pct = v => (v>0?"+":"") + v + "%";

/* ── tiny SVG chart helpers ── */
const NS = s => s; // template passthrough
function chartWrap(inner, h){ return `<div class="chart"><svg viewBox="0 0 360 ${h}" width="100%" role="img">${inner}</svg></div>`; }

/* grouped vertical bars: groups=[{label}], series=[{name,color,values[]}] */
function vbars(groups, series, opt={}){
  const H = opt.h || 190, padT = 26, padB = 22, padL = 4, padR = 4;
  const W = 360, plotW = W - padL - padR, plotH = H - padT - padB;
  const all = series.flatMap(s => s.values);
  const max = Math.max(...all, 0) * 1.12 || 1;
  const min = Math.min(...all, 0);
  const lo = min < 0 ? min * 1.12 : 0;
  const y = v => padT + plotH - (v - lo) / (max - lo) * plotH;
  const y0 = y(0);
  const gw = plotW / groups.length;
  const bw = Math.min(30, (gw - 14) / series.length);
  let out = `<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="${C.axis}" stroke-width="1"/>`;
  groups.forEach((g,gi)=>{
    const cx = padL + gw*gi + gw/2;
    out += `<text x="${cx}" y="${H-6}" font-size="10" fill="${C.dim}" text-anchor="middle">${esc(g.label)}</text>`;
    series.forEach((s,si)=>{
      const v = s.values[gi];
      const bx = cx - (bw*series.length + 2*(series.length-1))/2 + si*(bw+2);
      const by = Math.min(y(v), y0), bh = Math.max(Math.abs(y(v)-y0), 1.5);
      const r = Math.min(4, bw/2);
      // rounded data-end only (top for +, bottom for −)
      const path = v >= 0
        ? `M${bx},${by+bh} V${by+r} Q${bx},${by} ${bx+r},${by} H${bx+bw-r} Q${bx+bw},${by} ${bx+bw},${by+r} V${by+bh} Z`
        : `M${bx},${by} V${by+bh-r} Q${bx},${by+bh} ${bx+r},${by+bh} H${bx+bw-r} Q${bx+bw},${by+bh} ${bx+bw},${by+bh-r} V${by} Z`;
      out += `<path d="${path}" fill="${s.color}" class="tt" data-tt="${esc(g.label)} ${esc(s.name)}: ${esc(opt.fmt ? opt.fmt(v) : v)}"/>`;
      if(!opt.noLabel && bh > 4){
        const ly = v >= 0 ? by - 5 : by + bh + 11;
        out += `<text x="${bx+bw/2}" y="${ly}" font-size="9.5" fill="${C.ink}" text-anchor="middle" class="num">${esc(opt.fmt ? opt.fmt(v) : v)}</text>`;
      }
    });
  });
  return chartWrap(out, H);
}

/* horizontal bars: rows=[{label,value,color?,sub?,right?}] */
function hbars(rows, opt={}){
  const rowH = opt.rowH || 42, W = 360;
  const H = rows.length * rowH + 4;
  const max = opt.max || Math.max(...rows.map(r => r.value)) || 1;
  let out = "";
  rows.forEach((r,i)=>{
    const ty = i*rowH + 12;
    const by = i*rowH + 20, bh = 12;
    const bwFull = W;
    const bw = Math.max(bwFull * (r.value/max), 2);
    const col = r.color || C.s1;
    out += `<text x="0" y="${ty}" font-size="11" fill="${C.ink}">${esc(r.label)}</text>`;
    out += `<text x="${W}" y="${ty}" font-size="11" fill="${r.rightColor||C.dim}" text-anchor="end" class="num">${esc(r.right||"")}</text>`;
    out += `<rect x="0" y="${by}" width="${bwFull}" height="${bh}" rx="4" fill="${C.grid}"/>`;
    out += `<path d="M0,${by} H${Math.max(bw-4,0)} Q${bw},${by} ${bw},${by+bh/2} Q${bw},${by+bh} ${Math.max(bw-4,0)},${by+bh} H0 Z" fill="${col}" class="tt" data-tt="${esc(r.label)}: ${esc(r.tt||r.right||r.value)}"/>`;
    if(r.sub) out += `<text x="0" y="${by+bh+11}" font-size="9" fill="${C.dim}">${esc(r.sub)}</text>`;
  });
  return chartWrap(out, H);
}

/* line chart for ratios: series=[{name,color,values[]}] labels[] */
function lines(labels, series, opt={}){
  const H = opt.h || 170, padT = 18, padB = 22, padL = 22, padR = 42, W = 360;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const all = series.flatMap(s => s.values);
  const max = Math.max(...all)*1.1, min = Math.min(Math.min(...all), 0);
  const x = i => padL + plotW * (labels.length===1 ? .5 : i/(labels.length-1));
  const y = v => padT + plotH - (v-min)/(max-min)*plotH;
  let out = "";
  [0,.5,1].forEach(f=>{ const gy = padT + plotH*f;
    out += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="${C.grid}" stroke-width="1"/>`; });
  labels.forEach((l,i)=> out += `<text x="${x(i)}" y="${H-6}" font-size="10" fill="${C.dim}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      out += `<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="${s.color}" stroke="#1A1A2A" stroke-width="2" class="tt" data-tt="${esc(labels[i])} ${esc(s.name)}: ${v}%"/>`;
    });
    const last = s.values.length-1;
    out += `<text x="${x(last)+8}" y="${y(s.values[last])+4}" font-size="10" fill="${C.ink}" class="num">${s.values[last]}%</text>`;
  });
  return chartWrap(out, H);
}

/* waterfall for 実質純資産 */
function waterfall(items, opt={}){
  // items: [{label, value, kind:'base'|'add'|'total'}]
  const H = 210, padT = 24, padB = 40, W = 360, padL = 4, padR = 4;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const total = items.filter(i=>i.kind!=="total").reduce((a,b)=>a+b.value,0);
  const max = total * 1.1;
  const y = v => padT + plotH - v/max*plotH;
  const bw = plotW/items.length - 10;
  let run = 0, out = `<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="${C.axis}"/>`;
  items.forEach((it,i)=>{
    const bx = padL + (plotW/items.length)*i + 5;
    let b0, b1, col;
    if(it.kind === "total"){ b0 = 0; b1 = total; col = C.gold; }
    else { b0 = run; b1 = run + it.value; run = b1; col = it.kind==="base" ? C.s2 : C.s3; }
    const by = y(b1), bh = Math.max(y(b0)-y(b1), 2);
    out += `<path d="M${bx},${by+bh} V${by+4} Q${bx},${by} ${bx+4},${by} H${bx+bw-4} Q${bx+bw},${by} ${bx+bw},${by+4} V${by+bh} Z" fill="${col}" class="tt" data-tt="${esc(it.label)}: ${esc(yen(it.value))}"/>`;
    if(it.kind!=="total" && i < items.length-1)
      out += `<line x1="${bx+bw}" y1="${by}" x2="${bx+bw+10}" y2="${by}" stroke="${C.axis}" stroke-dasharray="2 3"/>`;
    out += `<text x="${bx+bw/2}" y="${by-5}" font-size="9.5" fill="${C.ink}" text-anchor="middle" class="num">${esc(yen(it.value))}</text>`;
    const words = it.label.split("\n");
    words.forEach((w,wi)=> out += `<text x="${bx+bw/2}" y="${H-26+wi*11}" font-size="8.5" fill="${C.dim}" text-anchor="middle">${esc(w)}</text>`);
  });
  return chartWrap(out, H);
}

/* benchmark row: value vs up to 3 ranges */
function benchRow(r){
  const ranges = [
    r.oki ? {label:"沖縄中小", col:C.s2, v:r.oki} : null,
    r.jp ? {label:"全国中小", col:C.s3, v:r.jp} : null,
    r.ind ? {label:r.indLabel||"業界", col:C.s4, v:r.ind} : null
  ].filter(Boolean);
  const highs = ranges.map(x=>x.v[1]);
  const max = Math.max(r.y9, r.y8||0, ...highs) * 1.15 || 1;
  const W = 360, laneH = 7, gap = 3;
  const H = ranges.length*(laneH+gap) + 14;
  const sx = v => Math.min(v/max*W, W);
  let out = "";
  ranges.forEach((rg,i)=>{
    const ly = 8 + i*(laneH+gap);
    out += `<rect x="0" y="${ly}" width="${W}" height="${laneH}" rx="3" fill="${C.grid}"/>`;
    out += `<rect x="${sx(rg.v[0])}" y="${ly}" width="${Math.max(sx(rg.v[1])-sx(rg.v[0]),2)}" height="${laneH}" rx="3" fill="${rg.col}" opacity=".45"/>`;
  });
  const lanesBottom = 8 + ranges.length*(laneH+gap) - gap;
  if(r.y8 !== undefined){
    const x8 = sx(r.y8);
    out += `<line x1="${x8}" y1="4" x2="${x8}" y2="${lanesBottom+4}" stroke="${C.dim}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  }
  const x9 = sx(r.y9);
  out += `<line x1="${x9}" y1="2" x2="${x9}" y2="${lanesBottom+6}" stroke="${C.gold}" stroke-width="3" stroke-linecap="round"/>`;
  // verdict vs best available range (業界 > 全国 > 沖縄)
  const ref = (r.ind || r.jp || r.oki);
  let tag = "", tagCol = "";
  if(ref){
    const above = r.y9 > ref[1], below = r.y9 < ref[0];
    const goodSide = r.invert ? below : above;
    const badSide = r.invert ? above : below;
    if(goodSide){ tag = r.invert ? "基準より良好" : "基準超え"; tagCol = C.good; }
    else if(badSide){ tag = "基準未達"; tagCol = C.serious; }
    else { tag = "基準圏内"; tagCol = C.dim; }
  }
  const lowBadTag = r.lowBad && tag==="基準未達";
  return `<div class="bench">
    <div class="bh"><div class="bn">${esc(r.name)}</div>
      <div class="bv num" style="color:${C.gold}">${r.y9}</div>
      ${tag?`<span class="tag" style="color:${tagCol};border:1px solid ${tagCol};opacity:.95">${tag}${r.invert?" ↓良":""}</span>`:""}
    </div>
    <svg viewBox="0 0 360 ${H}" width="100%" style="margin-top:5px">${out}</svg>
    <div class="bnote">${r.y8!==undefined?`第8期 ${r.y8} → 第9期 <b style="color:${C.gold}">${r.y9}</b>`:`第9期 ${r.y9}`}${r.note?` ・ ${esc(r.note)}`:""}</div>
  </div>`;
}

document.addEventListener("click", e=>{

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

function scoreRing(score){
  const r = 34, c = 2*Math.PI*r, f = c*score/100;
  return `<svg width="92" height="92" viewBox="0 0 92 92" class="ring">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${C.grid}" stroke-width="7"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${C.gold}" stroke-width="7"
      stroke-dasharray="${f} ${c}" stroke-linecap="round" transform="rotate(-90 46 46)"/>
    <text x="46" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="${C.ink}" class="num">${score}</text>
    <text x="46" y="60" text-anchor="middle" font-size="9" fill="${C.dim}">/ 100</text>
  </svg>`;
}

      <div class="tile"><div class="l">基準ケース 売上</div><div class="v num">${yen(b.base.sales)}</div><div class="s">純利益 ${yen(b.base.net)}</div></div>
      <div class="tile" style="border-color:var(--gold-border)"><div class="l">実績反映版 売上</div><div class="v num gold">${yen(b.upside.sales)}</div><div class="s">本業${yen(b.upside.salesCore)}+中古車${yen(b.upside.salesUsed)}</div></div>
      <div class="tile"><div class="l">実績反映 純利益</div><div class="v num gold">${yen(b.upside.net)}</div><div class="s">経常 ${yen(b.upside.ord)}</div></div>
      <div class="tile"><div class="l">自己資本比率 着地</div><div class="v num">約${b.upside.eqr}%</div><div class="s">実質 約${b.upside.eqrReal}%</div></div>
    </div>
    <div class="note">前提: 粗利率${b.upside.gpm}% / 営業利益${yen(b.upside.op)} / 減価償却 実態${yen(b.dep)} / 元金返済 年${yen(b.principal)} / 中間納付 約${yen(b.interimTax)}。<br>📍 ${esc(b.aprilActual.note)}</div>
  </div>

  <div class="card"><h2>第10期 シミュレーター<span class="sub">動かして着地を試算</span></h2>
    <div class="sl"><div class="slh"><span>本業売上 (レンタカー+ディテ他)</span><b class="num" id="o-core"></b></div>
      <input type="range" id="s-core" min="70" max="140" step="5" value="100"></div>
    <div class="sl"><div class="slh"><span>中古車販売 売上</span><b class="num" id="o-used"></b></div>
      <input type="range" id="s-used" min="0" max="50" step="5" value="30"></div>
    <div class="sl"><div class="slh"><span>粗利率</span><b class="num" id="o-gpm"></b></div>
      <input type="range" id="s-gpm" min="40" max="62" step="0.1" value="53.8"></div>
    <div class="sl"><div class="slh"><span>販管費</span><b class="num" id="o-sga"></b></div>
      <input type="range" id="s-sga" min="35" max="60" step="1" value="45"></div>
    <div class="sl"><div class="slh"><span>営業外収支 (車両売却益等)</span><b class="num" id="o-noi"></b></div>
      <input type="range" id="s-noi" min="0" max="10" step="0.5" value="4.6"></div>
    <div class="out">
      <div class="o"><div class="l">売上高</div><div class="v num" id="r-sales"></div></div>
      <div class="o"><div class="l">営業利益</div><div class="v num" id="r-op"></div></div>
      <div class="o"><div class="l">経常利益</div><div class="v num" id="r-ord"></div></div>
      <div class="o"><div class="l">純利益 (実効税率35%)</div><div class="v num gold" id="r-net"></div></div>
      <div class="o"><div class="l">自己資本比率 概算</div><div class="v num" id="r-eqr"></div></div>
      <div class="o"><div class="l">vs 第9期純利益</div><div class="v num" id="r-vs"></div></div>
    </div>
    <div class="judge" id="r-judge"></div>
    <div class="note">自己資本比率は概算((純資産1,092万+純利益)÷推定総資産)。税は経常×35%(第10期実績反映版の実効税率と同水準)で簡易計算。</div>
  </div>

  <div class="card"><h2>ディテーリング事業<span class="sub">成長の本命 ・ 前年比${dt.yoy}%</span></h2>
    <div class="tiles">
      <div class="tile"><div class="l">第9期 実績</div><div class="v num">${yen(dt.y9)}</div><div class="s up">前年 ${yen(dt.y8)} → 2倍</div></div>
      <div class="tile"><div class="l">直近6ヶ月ペース</div><div class="v num gold">年${yen(dt.runRateYear)}</div><div class="s">月${yen(dt.runRateMonthly)} ・ 加速中</div></div>
    </div>
    <div style="font-size:12px;font-weight:600;margin:14px 0 4px;color:var(--gold-light)">売上の3層構造 (実ジョブ${dt.jobs}件 ${esc(dt.period)})</div>
    ${hbars(dt.layers.map(l=>({label:`${l.name} ${l.count}件`, value:l.sales, right:yen(l.sales), color:C.s1, tt:yenFull(l.sales)})), {rowH:40})}
    ${dt.layers.map(l=>`<div class="note" style="margin-top:6px"><b style="color:var(--text)">${esc(l.name)}</b> 客単価約${yen(l.unit)}${l.unitHigh?`〜${yen(l.unitHigh)}`:""} — ${esc(l.note)}</div>`).join("")}
    <hr class="hairline">
    <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:var(--gold-light)">成長ステージ目標</div>
    ${hbars(dt.stages.map((s,i)=>({label:s.term, value:s.target, right:yen(s.target), color:i===0?C.s2:C.s1})), {rowH:38})}
    <ul class="plain" style="margin-top:8px">${dt.insights.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  </div>

  <div class="card"><h2>技術者投資 シミュレーター<span class="sub">高単価コーティングの伸ばし方</span></h2>
    <div class="sl"><div class="slh"><span>高単価コーティング 台数/月</span><b class="num" id="o-dcnt"></b></div>
      <input type="range" id="s-dcnt" min="1" max="10" step="1" value="1"></div>
    <div class="sl"><div class="slh"><span>平均単価</span><b class="num" id="o-dunit"></b></div>
      <input type="range" id="s-dunit" min="5" max="25" step="1" value="12"></div>
    <div class="sl"><div class="slh"><span>業販スタンダード値上げ</span><b class="num" id="o-dup"></b></div>
      <input type="range" id="s-dup" min="0" max="20" step="5" value="0"></div>
    <label class="tgl"><input type="checkbox" id="s-dhire">専属技術者を外部採用する (年${yen(dt.hireCost)})</label>
    <div class="out">
      <div class="o"><div class="l">部門年商 見込み</div><div class="v num gold" id="r-dsales"></div></div>
      <div class="o"><div class="l">増収分の粗利 (65%)</div><div class="v num" id="r-dgp"></div></div>
      <div class="o"><div class="l">採用コスト差引 損益</div><div class="v num" id="r-dnet"></div></div>
      <div class="o"><div class="l">第10期目標 1,000万 まで</div><div class="v num" id="r-dgap"></div></div>
    </div>
    <div class="judge" id="r-djudge"></div>
    <div class="note">ベース=直近6ヶ月run-rate(年${yen(dt.runRateYear)}・高単価 月1台を含む)。増収粗利は65%(実績レンジ60〜75%)で計算。金城専任化なら採用コストの代わりにレンタル側の補充判断が必要。</div>
  </div>

  <div class="card"><h2>アクションリスト<span class="sub">チェックはこの端末に保存</span></h2>
    <div id="acts">${d.actions.map(a=>`
      <label class="act" id="act-${a.id}"><input type="checkbox" data-id="${a.id}">
        <span class="at"><span class="tag2">${esc(a.tag)}</span>${esc(a.text)}</span></label>`).join("")}
    </div>
  </div>`;

  /* simulator wiring */
  const $ = id => document.getElementById(id);
  const M = 1e6;
  function sim(){
    const core = +$("s-core").value * M, used = +$("s-used").value * M;
    const gpm = +$("s-gpm").value / 100, sga = +$("s-sga").value * M, noi = +$("s-noi").value * M;
    const sales = core + used, gp = sales * gpm, op = gp - sga, ord = op + noi;
    const net = ord > 0 ? ord * 0.65 : ord;
    const eqr = (10920858 + net) / (73482789 + net + 7500000) * 100;
    $("o-core").textContent = yen(core); $("o-used").textContent = yen(used);
    $("o-gpm").textContent = (gpm*100).toFixed(1)+"%"; $("o-sga").textContent = yen(sga); $("o-noi").textContent = "+"+yen(noi);
    $("r-sales").textContent = yen(sales); $("r-op").textContent = yen(op);
    $("r-ord").textContent = yen(ord); $("r-net").textContent = yen(net);
    $("r-eqr").textContent = "約" + eqr.toFixed(1) + "%";
    const vs = net / 7547267;
    $("r-vs").textContent = "×" + vs.toFixed(1) + "倍";
    $("r-vs").className = "v num " + (vs >= 1 ? "up" : "down");
    const j = $("r-judge");
    if(net >= 19250000){ j.style.borderColor = j.style.color = "#4fc06c"; j.textContent = "🏆 実績反映版予算(純利益1,925万)を達成。純利益1,500万超で「沖縄県中小企業のトップ層」が定量的に確定するライン。"; }
    else if(net >= 10800000){ j.style.borderColor = j.style.color = C.gold; j.textContent = "◎ 基準ケース(純利益1,080万)超え。自己資本比率20%台へ前進。実績反映版1,925万まで残り" + yen(19250000-net) + "。"; }
    else if(net > 0){ j.style.borderColor = j.style.color = C.serious; j.textContent = "△ 黒字だが基準ケース(1,080万)未達。販管費・粗利率の前提を確認。"; }
    else { j.style.borderColor = j.style.color = C.crit; j.textContent = "⛔ 赤字圏。前提を見直してください。"; }
  }
  ["s-core","s-used","s-gpm","s-sga","s-noi"].forEach(id=>$(id).addEventListener("input", sim));
  sim();

  function dsim(){
    const cnt = +$("s-dcnt").value, unit = +$("s-dunit").value * 10000, up = +$("s-dup").value / 100;
    const hire = $("s-dhire").checked;
    const addHigh = (cnt - 1) * unit * 12;           // 現状月1台がベースに含まれる
    const addUp = 3416800 * up;
    const salesY = DATA.detailing.runRateYear + addHigh + addUp;
    const addGp = (addHigh + addUp) * DATA.detailing.grossMargin;
    const netD = addGp - (hire ? DATA.detailing.hireCost : 0);
    const gap = 10000000 - salesY;
    $("o-dcnt").textContent = cnt + "台/月"; $("o-dunit").textContent = yen(unit);
    $("o-dup").textContent = "+" + Math.round(up*100) + "%";
    $("r-dsales").textContent = yen(salesY);
    $("r-dgp").textContent = "+" + yen(addGp);
    $("r-dnet").textContent = (netD >= 0 ? "+" : "") + yen(netD);
    $("r-dnet").className = "v num " + (netD >= 0 ? "up" : "down");
    $("r-dgap").textContent = gap > 0 ? "あと" + yen(gap) : "達成 🎉";
    const j = $("r-djudge");
    if(hire && netD < 0){ j.style.borderColor = j.style.color = C.serious; j.textContent = "△ この台数・単価では採用コスト(年560万)を増収粗利で回収できない。月" + Math.ceil((DATA.detailing.hireCost/DATA.detailing.grossMargin/12)/unit + 1) + "台前後が損益分岐の目安。"; }
    else if(hire){ j.style.borderColor = j.style.color = "#4fc06c"; j.textContent = "◎ 採用コストを回収して年+" + yen(netD) + "の粗利上乗せ。引継ぎ書の試算(控えめ稼働でも粗利700〜880万で回収可)と整合。"; }
    else if(salesY >= 10000000){ j.style.borderColor = j.style.color = "#4fc06c"; j.textContent = "◎ 第10期目標1,000万をクリアする組み合わせ。ただし専任ゼロのままではレンタル業務とのカニバリが深刻化=採用/専任化の判断が前提。"; }
    else { j.style.borderColor = j.style.color = C.gold; j.textContent = "現状ペース+α。高単価コーティングを月6台まで伸ばすと+年600万(引継ぎ書試算)。"; }
  }
  ["s-dcnt","s-dunit","s-dup"].forEach(id=>$(id).addEventListener("input", dsim));
  $("s-dhire").addEventListener("change", dsim);
  dsim();

  /* actions persistence */
  const saved = JSON.parse(localStorage.getItem("kh_acts") || "{}");
  document.querySelectorAll("#acts input").forEach(cb=>{
    const id = cb.dataset.id;
    cb.checked = !!saved[id];
    cb.closest(".act").classList.toggle("done", cb.checked);
    cb.addEventListener("change", ()=>{
      saved[id] = cb.checked;
      localStorage.setItem("kh_acts", JSON.stringify(saved));
      cb.closest(".act").classList.toggle("done", cb.checked);
    });
  });
}

/* ── nav ── */
document.querySelectorAll("#tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("pg-" + b.dataset.p).classList.add("active");
    window.scrollTo({top:0});
  });
});

function boot(){
  document.getElementById("lock").style.display = "none";
  ["hdr","main","tabs"].forEach(id=>document.getElementById(id).style.display = "");
  document.getElementById("hdr-date").textContent = "基準日 " + DATA.meta.dataDate + " ・ 第9期申告ベース";
  renderHome(); renderFin(); renderBench(); renderAsset(); renderPlan();
  document.getElementById("pg-home").classList.add("active");
}
tryStoredKey();
</script>
</body>
</html>
